[project]
name = "diff-review-tools"
version = "0.1.0"
description = "diff-review スキルの決定論収集 CLI（変更ファイルに適用される規約の列挙）"
requires-python = ">=3.12"
dependencies = [
    # glob 照合(** / ブレース / 文字集合)。ブレース展開の上限は bracex を直接使う
    "wcmatch>=10",
    "bracex>=2",
    # .claude/rules の YAML frontmatter(paths:)
    "python-frontmatter>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

# スキルをプラグインとして分離しても、`uv run --project <skill-dir>` で
# requires-python に沿った .venv を用意して実行する(venv の置き場は
# scripts/run-python.sh が UV_PROJECT_ENVIRONMENT でスキル外へ逃がす)。
# 配布物ではないので package 化しない。
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts"]
pythonpath = ["scripts"]
