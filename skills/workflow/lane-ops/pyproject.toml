[project]
name = "lane-ops-tools"
version = "0.1.0"
description = "lane-ops スキルの決定論ツール（ワーカー規約ジェネレータ・イベント購読フィルタ）"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

# スキルをプラグインとして分離しても、`uv run --project <skill-dir>` で
# requires-python に沿った venv を用意して実行する。配布物ではないので package 化しない。
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts"]
pythonpath = ["scripts"]
